# ============================================================================
#  CV01 · 每次 push / PR 扫一遍密钥与本机实况
#  ---------------------------------------------------------------------------
#  本地对应物是 node tools/secret-scan.mjs —— 同一套规则、同一个退出码语义。
#  两道都留着：自带扫描器零依赖、顺带查「本机实况有没有漏回仓库」；
#  gitleaks 官方 action 规则更全，是主闸门。
#
#  为什么 fetch-depth: 0：默认的浅克隆只有最近一次提交，翻不了历史，
#  而历史恰恰是密钥最爱藏的地方。
# ============================================================================

name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码（要全历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 自带扫描器（零依赖）
        run: node tools/secret-scan.mjs

      - name: gitleaks（官方 action）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
